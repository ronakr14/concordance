[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concordance"
version = "0.1.0"
description = "Provider sanctions and exclusions reconciliation engine"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ronak Rathore" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "structlog>=24.1",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
llm = ["httpx>=0.27", "jsonschema>=4.22"]
db = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]
assistant = ["sqlglot>=25.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "faker>=25.0",
    "pandas-stubs",
    "types-openpyxl",
]

[project.scripts]
concordance = "concordance.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concordance = ["data/reference/*.csv", "data/reference/*.json", "llm/prompts/*.md"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src/concordance"]

[[tool.mypy.overrides]]
module = ["concordance.matching.*", "concordance.llm.*", "concordance.domain", "concordance.protocols"]
strict = true

[tool.coverage.run]
source = ["concordance"]
