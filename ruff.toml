line-length = 100
target-version = "py312"
src = ["backend/src", "tests"]
extend-exclude = [".venv", "data", "reports"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["ARG"]
# Typer commands declare --seed as part of the CLI contract even where the
# not-yet-built body ignores it.
"backend/src/concordance/cli.py" = ["ARG001"]
"tasks.py" = ["ARG001"]
# Corruption operations share one signature so they can live in a registry;
# most of them need only part of it.
"backend/src/concordance/synth/corruption.py" = ["ARG001"]
# The provider error taxonomy is named for the condition, not the class - the
# router reads `except RateLimited`, and PLAN's Stage 4 checklist fixes these
# exact names. An `Error` suffix on every one of them adds nothing.
"backend/src/concordance/llm/errors.py" = ["N818"]
"backend/src/concordance/llm/prompt.py" = ["N818"]
# `NullCache` implements the `ResponseCache` protocol and must keep its
# parameter names; ignoring them is the whole behaviour.
"backend/src/concordance/llm/cache.py" = ["ARG002"]

[lint.isort]
known-first-party = ["concordance"]
